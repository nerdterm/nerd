# cargo-cackle configuration (schema 0.8+).
# [pkg.*] blocks were generated by a static grep over crate sources, not cackle's own link-time
# analysis -- an approximation; a real `cargo cackle check` may need fixes.
# No crate is granted the net api: nothing should reach the network, even when a crate
# physically contains net code (see per-package notes below).

[common]
version = 2
import_std = ["fs", "net", "process", "terminate", "unsafe"]

[api.net]
include = ["std::net"]

[api.fs]
include = ["std::fs"]

[api.process]
include = ["std::process"]

[sandbox]
# Bubblewrap is Linux-only (namespaces); cackle has no macOS sandbox for this.
kind = "Disabled"

[pkg.aho-corasick]
allow_apis = ["fs", "unsafe"]

[pkg.alacritty_terminal]
allow_apis = ["fs", "process", "unsafe"]
# The pane emulator; its tty module can spawn a shell, which nerd never calls (panes come from the broker).

[pkg.allocator-api2]
allow_apis = ["unsafe"]

[pkg.anyhow]
allow_apis = ["fs", "process", "unsafe"]
allow_build_instructions = true

