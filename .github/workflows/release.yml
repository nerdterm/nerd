name: release

# No macOS runners in CI: scripts/publish-binary.sh builds the binary on the maintainer's Mac
# at the tag. The ruleset's pull-request bypass covers only this release PR, which still waits
# for the maintainer's approval on the `pr` check.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
